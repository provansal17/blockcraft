class Gen{
  constructor(seed,o){o=o||{};this.seed=seed>>>0;this.o=o;this.type=o.type||'normal';this.structs=o.structs!==false;const s=this.seed;
    const N=k=>new Noise(s+k*7919);
    this.nc=N(1);this.ne=N(2);this.nt=N(3);this.nh=N(4);this.nw=N(5);this.nr=N(6);this.nd=N(7);this.nrg=N(8);this.nm=N(9);
    this.cv1=N(10);this.cv2=N(11);this.cv3=N(12);this.cb=N(13);this.ni=N(14);this.nds=N(15);this.nf=N(16);
    this.nn=N(20);this.nn2=N(21);this.nb=N(22);this.nend=N(30);this.nend2=N(31);
    this.sc=this.type==='large'?4:1;this.cache=new Map();this.cells=new Map();
    this.single=o.biome&&BI[o.biome]!==undefined?BI[o.biome]:BI.plains;
    // слои плоского мира: «блок*кол-во» через запятую; поддерживается и запись «кол-во*блок»; не выше 120 блоков
    this.flat=[];for(const t of (o.layers===undefined?'bedrock,dirt*2,grass_block':o.layers).split(',')){const q=t.trim().toLowerCase().replace(/^minecraft:/,'');if(!q)continue;let [k,n]=q.split('*').map(v=>v.trim());if(/^\d+$/.test(k)&&n){[k,n]=[n,k];}
      const id=BK[k];if(id===undefined||(id!==0&&!SOLIDB_OK(id)))continue;for(let i=0;i<Math.max(1,Math.min(120,+n||1))&&this.flat.length<120;i++)this.flat.push(id);}
    this.voidW=this.flat.length>0&&this.flat.every(v=>v===0);if(!this.flat.length)this.flat=[BK.bedrock,BK.dirt,BK.dirt,BK.grass_block];
    this.flatBio=BI[o.biome]!==undefined?BI[o.biome]:BI.plains;
    const r=RNG(s^0x5717);const a0=r()*TAU;this.strongholds=[];
    for(let i=0;i<3;i++){const a=a0+i*TAU/3,d=600+r()*400;this.strongholds.push([Math.round(Math.cos(a)*d/16)*16+8,22,Math.round(Math.sin(a)*d/16)*16+8]);}
    // столбы Края
    const pr=RNG(s^0xE4D);this.pillars=[];const hs=[];for(let i=0;i<10;i++)hs.push(76+i*3);for(let i=9;i>0;i--){const j=Math.floor(pr()*(i+1));[hs[i],hs[j]]=[hs[j],hs[i]];}

  }

  col(x,z){const key=(x+50000)*100000+(z+50000);let c=this.cache.get(key);if(c)return c;if(this.cache.size>80000)this.cache.clear();c=this.colC(x,z);this.cache.set(key,c);return c;}
  colC(x,z){const T=this.type,s=this.sc;
    if(T==='flat')return {h:this.voidW?64:this.flat.length-1,b:this.flatBio,t:.3,hu:.2,mf:0,flat:true};

    if(T==='islands')C=this.ni.f2(x/260,z/260,5)*2.1-.62;
    const E=this.ne.f2(x/(700*s),z/(700*s),4)*1.7;
    const cell=T==='single'?null:this.cellOf(x,z);const Tm=cell?cell.t:0,Hu=cell?cell.hu:0;
    const W=this.nw.f2(x/(360*s),z/(360*s),3)*1.8;
    const R=Math.abs(this.nr.f2(x/(400*s),z/(400*s),4))*1.7;
    const D=this.nd.f2(x/70,z/70,4);
    let h;
    if(C<-.3)h=SEA-8+(C+.3)*50;else if(C<-.12)h=SEA-8+(C+.3)/.18*10;else h=SEA+2+(C+.12)*20;
    const amp=T==='amplified'?2.2:1;

    let b;

    }

    const ore=(id,n,y0,y1,tries)=>{for(let t=0;t<tries;t++){let x=Math.floor(r()*16),y=Math.floor(y0+r()*(y1-y0)),z=Math.floor(r()*16);for(let i=0;i<n;i++){if(x>=0&&x<16&&z>=0&&z<16&&y>0&&y<CH){const j=IX(x,y,z);if(b[j]===K.netherrack||(id===K.ancient_debris&&(b[j]===K.basalt||b[j]===K.blackstone)))b[j]=id;}x+=Math.floor(r()*3)-1;y+=Math.floor(r()*3)-1;z+=Math.floor(r()*3)-1;}}};

  endIsl(x,z){const d=Math.hypot(x,z);if(d<90){const k=1-d/90;return [62+k*4+this.nend.n2(x/30,z/30)*1.5,62-Math.pow(k,.6)*38+this.nend.n2(x/20,z/20)*4];}

/* ---------- деревья (используются генератором и саженцами) ---------- */
function tree(S,x,y,z,type,r){const K=BK;
  const L=(xx,yy,zz,id)=>S(xx,yy,zz,id,0,1),T=(xx,yy,zz,id,m)=>S(xx,yy,zz,id,m||0,2);

    case 'oak':case 'birch':case 'swamp_oak':case 'cherry_small':{const lg=type==='birch'?K.birch_log:K.oak_log,lv=type==='birch'?K.birch_leaves:K.oak_leaves;const h=(type==='birch'?5:4)+Math.floor(r()*3);

    case 'big_oak':{const h=7+Math.floor(r()*4);for(let k=0;k<h;k++)T(x,y+k,z,K.oak_log);
      for(let i=0;i<4;i++){const a=r()*TAU,l=2+Math.floor(r()*2),yy=y+h-3+Math.floor(r()*3);for(let t=1;t<=l;t++)T(x+Math.round(Math.cos(a)*t),yy+Math.floor(t/2),z+Math.round(Math.sin(a)*t),K.oak_log,Math.abs(Math.cos(a))>.7?1:2);
        const bx=x+Math.round(Math.cos(a)*l),bz=z+Math.round(Math.sin(a)*l),by=yy+Math.floor(l/2);for(let dy=-1;dy<=1;dy++)blob(bx,by+dy,bz,dy?2:3,K.oak_leaves,true);}

    case 'jungle':{const h=9+Math.floor(r()*8),big=r()<.3;for(let k=0;k<h;k++){T(x,y+k,z,K.jungle_log);if(big){T(x+1,y+k,z,K.jungle_log);T(x,y+k,z+1,K.jungle_log);T(x+1,y+k,z+1,K.jungle_log);}
        if(r()<.3)L(x-1,y+k,z,K.vine);if(r()<.3)L(x,y+k,z-1,K.vine);}
      for(let d=-2;d<=0;d++)blob(x,y+h+d,z,d===0?2:3+(big?1:0),K.jungle_leaves,true);break;}
    case 'jungle_bush':{T(x,y,z,K.jungle_log);blob(x,y,z,2,K.oak_leaves,true);blob(x,y+1,z,1,K.oak_leaves);break;}
    case 'acacia':{const h=4+Math.floor(r()*2),dx=r()<.5?1:-1,dz=r()<.5?1:-1;let cx=x,cz=z;for(let k=0;k<h;k++){if(k>2){cx+=dx;cz+=dz;}T(cx,y+k,cz,K.acacia_log);}

    case 'dark_oak':{const h=6+Math.floor(r()*3);for(let k=0;k<h;k++)for(const [a,c] of [[0,0],[1,0],[0,1],[1,1]])T(x+a,y+k,z+c,K.dark_oak_log);

      for(let d=-3;d<0;d++)for(let a=-2;a<=2;a++)for(let c=-2;c<=2;c++)if(Math.abs(a)===2||Math.abs(c)===2){if(Math.abs(a)===2&&Math.abs(c)===2)continue;L(x+a,y+h+d+1,z+c,K.red_mushroom_block);}break;}
    case 'brown_mushroom':{const h=4+Math.floor(r()*3);for(let k=0;k<h;k++)T(x,y+k,z,K.mushroom_stem);blob(x,y+h,z,3,K.brown_mushroom_block,true);break;}
    case 'crimson':case 'warped':{const st=type==='crimson'?K.crimson_stem:K.warped_stem,w=type==='crimson'?K.nether_wart_block:K.warped_wart_block;const h=4+Math.floor(r()*7);
      for(let k=0;k<h;k++)T(x,y+k,z,st);for(let d=-3;d<=0;d++){const rad=d===0?1:d===-1?2:2;for(let a=-rad;a<=rad;a++)for(let c=-rad;c<=rad;c++){if(d<-1&&Math.abs(a)<rad&&Math.abs(c)<rad)continue;L(x+a,y+h+d,z+c,r()<.06?K.shroomlight:w);}}
      L(x,y+h+1,z,w);break;}
  }
}

function matchRecipe(grid,W){const H=grid.length/W;let x0=W,y0=H,x1=-1,y1=-1;const items=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const s=grid[y*W+x];if(s){items.push(s.id);if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y;}}
  if(!items.length)return null;const w=x1-x0+1,h=y1-y0+1;
  for(const r of RECIPES){if(r.shaped){if(r.w!==w||r.h!==h)continue;for(const mir of [0,1]){let ok=true;
        for(let y=0;y<h&&ok;y++)for(let x=0;x<w&&ok;x++){const s=grid[(y0+y)*W+x0+x];const need=r.shaped[y][mir?w-1-x:x];if(!need){if(s)ok=false;}else if(!s||!need.includes(s.id))ok=false;}
        if(ok)return r;}}
    else{if(r.less.length!==items.length)continue;const pool=items.slice();let ok=true;for(const need of r.less){const i=pool.findIndex(id=>need.includes(id));if(i<0){ok=false;break;}pool.splice(i,1);}if(ok)return r;}}
  return null;}

function dropItem(x,y,z,st,vel){if(!st||!st.n)return null;if(NET.guest&&hostAuth()){netGuestDrop(x,y,z,st,vel);return null;}/* предметы в мире хозяина создаёт хозяин */const e=new ItemEnt(x,y,z,st);if(vel){e.vx=vel[0];e.vy=vel[1];e.vz=vel[2];}else{e.vx=(Math.random()-.5)*2;e.vy=3;e.vz=(Math.random()-.5)*2;}ENTS.push(e);return e;}
const fireproof=id=>{const d=IT[id];return !!d&&(/netherite|ancient_debris/.test(d.k)||d.k==='nether_star');};
function updItem(e,dt){e.age+=dt;e.pick-=dt;if(e.age>300){e.dead=true;return;}
  // предметы сгорают в лаве и огне (кроме незеритовых и звезды Нижнего мира — те всплывают в лаве)
  if(!fireproof(e.st.id)){const b=getB(Math.floor(e.x),Math.floor(e.y+.1),Math.floor(e.z));if(e.inL||b===BK.fire||b===BK.soul_fire||b===BK.campfire&&false){e.burnT=(e.burnT||0)+dt;if(Math.random()<dt*10)spawnParticles('smoke',e.x,e.y+.2,e.z,1);if(e.inL||e.burnT>.4){e.dead=true;sfx('fizz',e.x,e.y,e.z);spawnParticles('flame',e.x,e.y+.2,e.z,4);return;}}}
  else if(e.inL){e.vy=Math.max(e.vy,1.2);}
  if(e.inW){e.vy+=12*dt;}physStep(e,dt);e.spin+=dt*1.5;
  if(e.age%1<dt){for(const o of ENTS){if(o===e||o.t!=='item'||o.dead||o.st.id!==e.st.id||o.st.ench||e.st.ench||o.st.dmg||e.st.dmg)continue;if(Math.abs(o.x-e.x)<.6&&Math.abs(o.y-e.y)<.6&&Math.abs(o.z-e.z)<.6&&o.st.n+e.st.n<=IT[e.st.id].stack){e.st.n+=o.st.n;o.dead=true;}}}
  if(e.pick<=0&&PLAYER.alive&&PLAYER.mode!=='spectator'){const dx=PLAYER.x-e.x,dy=PLAYER.y+.8-e.y,dz=PLAYER.z-e.z,d=Math.hypot(dx,dy,dz);
    if(d<1.6){const left=giveItem(e.st);if(left<e.st.n){sfx('pop',e.x,e.y,e.z);achieveItem(e.st.id);}if(left<=0)e.dead=true;else e.st.n=left;}}
  if(!e.dead&&e.pick<=0&&NET.hosting)for(const g of netProxies()){if(!g.alive||g.mode==='spectator')continue;if(Math.hypot(g.x-e.x,g.y+.8-e.y,g.z-e.z)<1.6){netGive(g,e.st);e.dead=true;sfx('pop',e.x,e.y,e.z);break;}}}
/* ---------- опыт ---------- */
class XPEnt extends Ent{constructor(x,y,z,v){super('xp',x,y,z);this.v=v;this.w=.25;this.h=.25;this.drag=1;this.step=0;}}
function spawnXP(x,y,z,v){if(NET.guest&&hostAuth()){netGuestXP(x,y,z,v);return;}while(v>0){const p=Math.min(v,v>=17?17:v>=7?7:v>=3?3:1);v-=p;const e=new XPEnt(x,y,z,p);e.vx=(Math.random()-.5)*3;e.vy=4;e.vz=(Math.random()-.5)*3;ENTS.push(e);}}
function updXP(e,dt){e.age+=dt;if(e.age>300){e.dead=true;return;}const dx=PLAYER.x-e.x,dy=PLAYER.y+.8-e.y,dz=PLAYER.z-e.z,d=Math.hypot(dx,dy,dz);
  if(d<8&&PLAYER.alive&&PLAYER.mode!=='spectator'){const k=(1-d/8)*30*dt;e.vx+=dx/d*k;e.vy+=dy/d*k;e.vz+=dz/d*k;}physStep(e,dt);
  if(d<1.2&&PLAYER.alive&&PLAYER.mode!=='spectator'){e.dead=true;addXP(e.v);sfx('xp',e.x,e.y,e.z,{pitch:.8+Math.random()*.6});}
  if(!e.dead&&NET.hosting)for(const g of netProxies()){if(!g.alive||g.mode==='spectator')continue;const gx=g.x-e.x,gy=g.y+.8-e.y,gz=g.z-e.z,gd=Math.hypot(gx,gy,gz);if(gd<8&&gd<d){const k=(1-gd/8)*30*dt;e.vx+=gx/gd*k;e.vy+=gy/gd*k;e.vz+=gz/gd*k;}if(gd<1.2){netXP(g,e.v);e.dead=true;sfx('xp',e.x,e.y,e.z);break;}}}
/* ---------- падающий блок, ТНТ ---------- */
function spawnFalling(x,y,z,id,m){const e=new Ent('falling',x+.5,y,z+.5);e.bid=id;e.bm=m;e.w=.98;e.h=.98;e.step=0;e.drag=.4;ENTS.push(e);}
function updFalling(e,dt){e.age+=dt;if(e.bid===BK.pointed_dripstone){e.maxV=Math.max(e.maxV||0,-e.vy);}physStep(e,dt);
  if(e.bid===BK.pointed_dripstone&&(e.onG||e.age>30)){// разбивается при ударе: осколки, звук, урон тем, кто под ним
    const fall=Math.max(1,(e.maxV||0)*(e.maxV||0)/48);for(const o of ENTS.concat([PLAYER]))if(o!==e&&(o.def||o===PLAYER)&&!o.dead&&Math.abs(o.x-e.x)<.75&&Math.abs(o.z-e.z)<.75&&o.y<=e.y+.2&&o.y+o.h>e.y-1.2)damage(o,Math.min(40,Math.ceil(fall*1.5)),'mob');
    spawnParticles('block',e.x,e.y+.5,e.z,14,BK.dripstone_block);sfx('break_stone',e.x,e.y,e.z,{pitch:1.3});if(Math.random()<.85)dropItem(e.x,e.y+.3,e.z,{id:IK.pointed_dripstone,n:1});e.dead=true;return;}
  if(e.onG||e.age>30){const bx=Math.floor(e.x),by=Math.floor(e.y+.1),bz=Math.floor(e.z);const c=getB(bx,by,bz);
  if(!c||BL[c].rep||BL[c].liquid){if(BL[e.bid].powder&&BL[c].liquid==='water')setB(bx,by,bz,BK[BL[e.bid].powder]);else setB(bx,by,bz,e.bid,e.bm);if(e.bid===BK.anvil){sfx('anvil',e.x,e.y,e.z);for(const o of ENTS)if(o.def&&Math.abs(o.x-e.x)<.8&&Math.abs(o.z-e.z)<.8)damage(o,Math.min(40,e.age*20),'mob');}}else dropItem(e.x,e.y,e.z,{id:e.bid,n:1});e.dead=true;}
  for(const o of ENTS.concat([PLAYER]))if(o!==e&&(o.def||o===PLAYER)&&e.vy<-3&&Math.abs(o.x-e.x)<.8&&Math.abs(o.z-e.z)<.8&&o.y+o.h>e.y&&o.y<e.y+1&&e.bid===BK.anvil)damage(o,4,'mob');}
function spawnTNT(x,y,z,fuse){const e=new Ent('tnt',x+.5,y,z+.5);e.fuse=fuse/20;e.w=.98;e.h=.98;e.vy=4;e.vx=(Math.random()-.5);e.vz=(Math.random()-.5);e.step=0;ENTS.push(e);sfx('fuse',x,y,z);return e;}
function updTNT(e,dt){physStep(e,dt);e.fuse-=dt;if(Math.random()<.5)spawnParticles('smoke',e.x,e.y+1,e.z,1);if(e.fuse<=0){e.dead=true;explode(e.x,e.y+.5,e.z,4,false,e);}}
/* ---------- молния ---------- */
function lightning(x,z){const y=topY(x,z)+1;const e=new Ent('bolt',x+.5,y,z+.5);e.noGrav=true;e.life=.6;e.seed=Math.random()*1e6;ENTS.push(e);sfx('thunder',x,y,z);flashSky();
  if(getB(x,y,z)===0&&fireOk(x,y,z,false)&&GAME.difficulty>=2)setB(x,y,z,BK.fire);
  for(const o of ENTS.concat([PLAYER]))if((o.def||o===PLAYER)&&Math.hypot(o.x-e.x,o.z-e.z)<3){damage(o,5,'lightning');o.fire=8;if(o.t==='creeper')o.charged=true;if(o.t==='pig'){replaceMob(o,'zombified_piglin');}if(o.t==='villager')replaceMob(o,'witch');}}
function topY(x,z){for(let y=CH-1;y>0;y--){const id=getB(x,y,z);if(id&&(SOLIDB[id]||BL[id].liquid))return y;}return 0;}
/* ---------- снаряды ---------- */
class Proj extends Ent{constructor(t,x,y,z,vx,vy,vz,owner){super(t,x,y,z);this.vx=vx;this.vy=vy;this.vz=vz;this.owner=owner;this.w=.25;this.h=.25;this.step=0;this.drag=.2;}}
function shoot(t,from,dir,speed,o){const e=new Proj(t,from[0],from[1],from[2],dir[0]*speed,dir[1]*speed,dir[2]*speed,o&&o.owner);Object.assign(e,o||{});ENTS.push(e);return e;}
function hitEntityAlong(e,x0,y0,z0,x1,y1,z1,ignore){let best=null,bt=2;for(const o of ENTS.concat(PLAYER.alive?[PLAYER]:[])){if(o===e||o===ignore||o.dead||!(o.def||o===PLAYER||o.t==='crystal'||o.rp))continue;if(o===PLAYER&&PLAYER.mode==='spectator')continue;
  const hw=o.w/2+.15;const t=segAABB(x0,y0,z0,x1,y1,z1,o.x-hw,o.y-.1,o.z-hw,o.x+hw,o.y+o.h+.1,o.z+hw);if(t!==null&&t<bt){bt=t;best=o;}}return best;}
function segAABB(x0,y0,z0,x1,y1,z1,a0,b0,c0,a1,b1,c1){let tmin=0,tmax=1;const d=[x1-x0,y1-y0,z1-z0],o=[x0,y0,z0],mn=[a0,b0,c0],mxx=[a1,b1,c1];
  for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-9){if(o[i]<mn[i]||o[i]>mxx[i])return null;}else{let t1=(mn[i]-o[i])/d[i],t2=(mxx[i]-o[i])/d[i];if(t1>t2)[t1,t2]=[t2,t1];tmin=Math.max(tmin,t1);tmax=Math.min(tmax,t2);if(tmin>tmax)return null;}}return tmin;}
function updProj(e,dt){e.age+=dt;if(e.age>(e.t==='trident'&&e.st?600:60)){e.dead=true;return;}
  // брошенный игроком трезубец подбирается, когда лежит/торчит рядом (и в полёте после удара)
  if(e.t==='trident'&&e.st&&e.age>.6&&PLAYER.alive&&PLAYER.mode!=='spectator'&&Math.hypot(PLAYER.x-e.x,PLAYER.y+.9-e.y,PLAYER.z-e.z)<1.6){
    if(giveItem(Object.assign({},e.st))===0){sfx('pop',e.x,e.y,e.z);e.dead=true;e.picked=true;UI.dirty=true;return;}}
  if(e.stuck){if(e.t==='arrow'&&e.age>1&&e.fromPlayer&&PLAYER.alive&&Math.hypot(PLAYER.x-e.x,PLAYER.y+1-e.y,PLAYER.z-e.z)<1.5){if(PLAYER.mode!=='creative'&&!e.noPick)giveItem({id:IK.arrow,n:1});sfx('pop',e.x,e.y,e.z);e.dead=true;}if(!SOLIDB[getB(Math.floor(e.sx),Math.floor(e.sy),Math.floor(e.sz))])e.stuck=false;return;}
  const grav=e.t==='arrow'||e.t==='trident'?20:e.t==='fireball'||e.t==='smallfire'||e.t==='skull'||e.t==='dfire'||e.t==='shulker_bullet'||e.t==='laser'?0:e.t==='eye'?0:24;
  if(e.homing&&!e.homing.dead){const t=e.homing;const dx=t.x-e.x,dy=t.y+t.h/2-e.y,dz=t.z-e.z,l=Math.hypot(dx,dy,dz)||1;e.vx+=(dx/l*6-e.vx)*dt*2;e.vy+=(dy/l*6-e.vy)*dt*2;e.vz+=(dz/l*6-e.vz)*dt*2;}
  if(e.t==='eye'){updEye(e,dt);return;}
  e.vy-=grav*dt;const k=Math.exp(-(e.inW?3:.05)*dt);e.vx*=k;e.vy*=k;e.vz*=k;
  const nx=e.x+e.vx*dt,ny=e.y+e.vy*dt,nz=e.z+e.vz*dt;
  const hit=hitEntityAlong(e,e.x,e.y,e.z,nx,ny,nz,e.age<.15?e.owner:null);
  if(hit){projHit(e,hit,null);return;}
  const r=rayBlocks([e.x,e.y,e.z],[nx-e.x,ny-e.y,nz-e.z],1,true);
  if(r){projHit(e,null,r);return;}
  e.x=nx;e.y=ny;e.z=nz;liquidState(e);
  if(e.t==='fireball'||e.t==='smallfire'||e.t==='dfire'||e.t==='skull')spawnParticles(e.t==='dfire'?'dragon':'smoke',e.x,e.y,e.z,1);
  if(e.t==='arrow'&&e.crit)spawnParticles('crit',e.x,e.y,e.z,1);
  e.yaw=Math.atan2(e.vx,e.vz);e.pitch=Math.atan2(e.vy,Math.hypot(e.vx,e.vz));}
function projHit(e,hit,r){const K=BK,t=e.t;const own=e.owner;
  if(hit&&hit.t==='crystal'){crystalHit(hit,own);e.dead=true;return;}
  if(t==='arrow'||t==='trident'){if(hit){if(hit.t==='enderman'&&t==='arrow'){enderTeleport(hit);return;}const sp=Math.hypot(e.vx,e.vy,e.vz);let dm=Math.ceil(sp/20*2*(e.dmgMul||1)*(t==='trident'?4:1)+(e.power?e.power*.5+.5:0));if(e.crit)dm+=Math.floor(Math.random()*dm/2+2);
      damage(hit,dm,'arrow',own||e);knock(hit,e,e.knock||2);if(e.flame)hit.fire=5;if(hit.def&&own===PLAYER)sfx('hit',PLAYER.x,PLAYER.y,PLAYER.z);
      if(t==='trident'){e.vx*=-.1;e.vy=-2;e.vz*=-.1;e.returning=e.loyal;if(!e.loyal){e.stuck=false;}return;}e.dead=true;return;}
    e.x=r.px-e.vx*.01;e.y=r.py-e.vy*.01;e.z=r.pz-e.vz*.01;e.stuck=true;e.sx=r.x+.5;e.sy=r.y+.5;e.sz=r.z+.5;e.vx=e.vy=e.vz=0;sfx('arrow_hit',e.x,e.y,e.z);
    if(getB(r.x,r.y,r.z)===K.tnt&&e.flame){setB(r.x,r.y,r.z,0);spawnTNT(r.x,r.y,r.z,80);}
    if(t==='trident'&&e.loyal)e.returning=true;return;}
  e.dead=true;const px=hit?hit.x:r.px,py=hit?hit.y+hit.h/2:r.py,pz=hit?hit.z:r.pz;
  if(t==='snowball'){if(hit){damage(hit,hit.t==='blaze'?3:0.01,'mob',own);knock(hit,e,1.5);}spawnParticles('snow',px,py,pz,6);}
  else if(t==='egg'){if(hit)damage(hit,.01,'mob',own);if(Math.random()<.125)spawnMob('chicken',px,py,pz,{baby:true});spawnParticles('egg',px,py,pz,6);}
  else if(t==='pearl'){spawnParticles('portal',px,py,pz,20);if(own===PLAYER){const tx=r?r.px-e.vx*.03:px,tz=r?r.pz-e.vz*.03:pz;PLAYER.x=tx;PLAYER.z=tz;PLAYER.y=(r?r.py-e.vy*.03:py)+.1;PLAYER.vx=PLAYER.vy=PLAYER.vz=0;PLAYER.fallD=0;damage(PLAYER,5,'fall');sfx('teleport',tx,PLAYER.y,tz);if(Math.random()<.05)spawnMob('endermite',tx,PLAYER.y,tz);}}
  else if(t==='fireball'){explode(px,py,pz,1,true,own);if(hit)damage(hit,6,'explosion',own);}
  else if(t==='smallfire'){if(hit){if(!hit.fireImm){damage(hit,5,'fire',own);hit.fire=5;}}else if(r){const fx=r.x+r.nx,fy=r.y+r.ny,fz=r.z+r.nz;if(getB(fx,fy,fz)===0&&fireOk(fx,fy,fz,false))setB(fx,fy,fz,K.fire);}}
  else if(t==='skull'){explode(px,py,pz,1,false,own);if(hit){damage(hit,8,'wither',own);addEffect(hit,'wither',10,1);}}
  else if(t==='dfire'){spawnCloud(px,(r?r.py:py),pz,'dragon',6);}
  else if(t==='potion'||t==='xp'){spawnParticles('potion',px,py,pz,20,null,e.pc);sfx('glass',px,py,pz);if(t==='xp'){spawnXP(px,py,pz,3+Math.floor(Math.random()*9));return;}
    for(const o of ENTS.concat([PLAYER]))if((o.def||o===PLAYER)&&Math.hypot(o.x-px,o.y-py,o.z-pz)<4)applyPotion(o,e.potion,true);}
  else if(t==='shulker_bullet'){if(hit){damage(hit,4,'magic',own);addEffect(hit,'levitation',10,0);}spawnParticles('crit',px,py,pz,8);}
  else if(t==='spit'){if(hit)damage(hit,1,'mob',own);}
  else if(t==='laser'){if(hit)damage(hit,6,'magic',own);}}
function updEye(e,dt){e.life-=dt;const tx=e.tx,tz=e.tz;const dx=tx-e.x,dz=tz-e.z,d=Math.hypot(dx,dz);
  if(e.life>1.2&&d>1){e.vx=dx/d*9;e.vz=dz/d*9;e.vy=(e.ty-e.y)*1.5;}else{e.vx*=.9;e.vz*=.9;e.vy=-.5;}
  e.x+=e.vx*dt;e.y+=e.vy*dt;e.z+=e.vz*dt;spawnParticles('portal',e.x,e.y,e.z,1);
  if(e.life<=0){e.dead=true;if(Math.random()<.2){sfx('glass',e.x,e.y,e.z);spawnParticles('block',e.x,e.y,e.z,10,BK.ender_chest);}else dropItem(e.x,e.y,e.z,{id:IK.ender_eye,n:1},[0,2,0]);}}
// облако драконьего дыхания
function spawnCloud(x,y,z,kind,life){const e=new Ent('cloud',x,y,z);e.noGrav=true;e.kind=kind;e.life=life;e.r=3;ENTS.push(e);}
function updCloud(e,dt){e.life-=dt;if(e.life<=0){e.dead=true;return;}for(let i=0;i<3;i++){const a=Math.random()*TAU,r=Math.random()*e.r;spawnParticles('dragon',e.x+Math.cos(a)*r,e.y+.2,e.z+Math.sin(a)*r,1);}
  if(PLAYER.alive&&Math.hypot(PLAYER.x-e.x,PLAYER.z-e.z)<e.r&&Math.abs(PLAYER.y-e.y)<2&&GAME.tick%10===0)damage(PLAYER,3,'dragon');}
/* ---------- эффекты ---------- */
function addEffect(e,k,sec,amp){if(e.rp){netEffProxy(e,k,sec,amp);return;}if(!e.effects)e.effects={};const cur=e.effects[k];if(cur&&cur.amp>amp&&cur.t>sec)return;e.effects[k]={t:sec,amp:amp||0};if(k==='absorption'&&e===PLAYER)PLAYER.absorb=4*(1+(amp||0));}
function applyPotion(o,p,splash){const m=splash?.75:1;switch(p){case 'healing':if(o.undead)damage(o,6*m,'magic');else heal(o,4*m*2);break;case 'harming':if(o.undead)heal(o,6*m);else damage(o,6*m,'magic');break;
  case 'strength':addEffect(o,'strength',180*m,0);break;case 'swiftness':addEffect(o,'speed',180*m,0);break;case 'slowness':addEffect(o,'slowness',90*m,0);break;case 'night_vision':addEffect(o,'night_vision',180*m,0);break;
  case 'invisibility':addEffect(o,'invisibility',180*m,0);break;case 'fire_resistance':addEffect(o,'fire_resistance',180*m,0);break;case 'poison':addEffect(o,'poison',45*m,0);break;case 'regeneration':addEffect(o,'regeneration',45*m,0);break;}}
function heal(e,a){e.hp=Math.min(e.max,e.hp+a);}
function tickEffects(e,dt){if(!e.effects)return;for(const k in e.effects){const f=e.effects[k];f.t-=dt;f.acc=(f.acc||0)+dt;
  if(k==='poison'&&f.acc>1.25){f.acc=0;if(e.hp>1)damage(e,1,'magic');}if(k==='wither'&&f.acc>2/(1+f.amp)){f.acc=0;damage(e,1,'wither');}
  if(k==='regeneration'&&f.acc>2.5/(1+f.amp)){f.acc=0;heal(e,1);}if(k==='hunger'&&e===PLAYER)addExh(.1*dt*20*.025);
  if(f.t<=0){delete e.effects[k];if(k==='absorption'&&e===PLAYER)PLAYER.absorb=0;}}}
/* ---------- лучи по блокам ---------- */
function rayBlocks(o,d,maxD,collOnly,fluids){let len=Math.hypot(d[0],d[1],d[2]);if(len<1e-9)return null;const dx=d[0]/len,dy=d[1]/len,dz=d[2]/len;maxD=maxD*(collOnly?len:1);
  let x=Math.floor(o[0]),y=Math.floor(o[1]),z=Math.floor(o[2]);const sx=dx>0?1:-1,sy=dy>0?1:-1,sz=dz>0?1:-1;
  const tdx=Math.abs(1/dx),tdy=Math.abs(1/dy),tdz=Math.abs(1/dz);let tx=(dx>0?x+1-o[0]:o[0]-x)*tdx,ty=(dy>0?y+1-o[1]:o[1]-y)*tdy,tz=(dz>0?z+1-o[2]:o[2]-z)*tdz;let t=0,nx=0,ny=0,nz=0;
  for(let i=0;i<300&&t<=maxD;i++){const id=getB(x,y,z);
    if(id&&(collOnly?SOLIDB[id]:(BL[id].shape!=='none'&&(!BL[id].liquid||fluids)))){const d2=BL[id];
      if(d2.shape==='cube'||(d2.liquid&&fluids))return {x,y,z,id,nx,ny,nz,t,px:o[0]+dx*t,py:o[1]+dy*t,pz:o[2]+dz*t};

function boatPhys(e,dt){e.noGrav=true;e.step=0;const bx=Math.floor(e.x),bz=Math.floor(e.z);const wAt=y=>{const b=getB(bx,Math.floor(y),bz);return BL[b].liquid==='water'||!!BL[b].wet;};
  const inW=wAt(e.y+.25)||wAt(e.y+.05);
  if(inW){let ty=Math.floor(e.y+.25);while(ty<CH-1&&wAt(ty+1))ty++;const surf=ty+14.2/16-.1;e.vy+=(surf-e.y)*10*dt;e.vy*=Math.exp(-5*dt);}else e.vy=Math.max(e.vy-GRAV*dt,-30);
  const below=getB(bx,Math.floor(e.y-.08),bz);const ice=below===BK.ice||below===BK.packed_ice||below===BK.blue_ice||below===BK.frosted_ice;
  const fr=inW?.9:ice?(below===BK.blue_ice?.989:.98):e.onG?.5:.95;const k=Math.pow(fr,dt*20);
  const r=e.rider;if(r&&r.riding===e&&r.alive){const fw=e.ctrlF||0,st0=e.ctrlT||0,st=Math.abs(st0)<.3?0:st0;const turn=-st*dt*2.6;e.yaw+=turn;r.yaw+=turn;
    const acc=(fw>0?1:fw<0?-.35:0)*(inW?9:ice?9:2.5);e.vx+=Math.sin(e.yaw)*acc*dt;e.vz+=Math.cos(e.yaw)*acc*dt;}
  e.vx*=k;e.vz*=k;const mx=inW?8:ice?(below===BK.blue_ice?40:24):2.4,hs=Math.hypot(e.vx,e.vz);if(hs>mx){e.vx*=mx/hs;e.vz*=mx/hs;}
  e.inBoatW=inW;}

  else if(e.phase==='strafe'){tx=p.x;ty=p.y+14;tz=p.z;e.st=e.st||{};e.fb=(e.fb||0)-dt;if(e.fb<=0&&distTo(e,p)<64&&can){e.fb=2.5;const dx=p.x-e.x,dy=p.y-e.y,dz=p.z-e.z,l=Math.hypot(dx,dy,dz);shoot('dfire',[e.x+dx/l*4,e.y,e.z+dz/l*4],[dx/l,dy/l,dz/l],12,{owner:e});sfx('dragon_fire',e.x,e.y,e.z);}

  if(e.phase==='perch'&&l<1){e.vx*=.5;e.vy*=.5;e.vz*=.5;}
  e.x+=e.vx*dt;e.y+=e.vy*dt;e.z+=e.vz*dt;if(e.phase!=='perch')e.yaw=Math.atan2(e.vx,e.vz);e.pitch=Math.atan2(e.vy,Math.hypot(e.vx,e.vz))*.5;

  if(GAME.tick%5===0){const bx=Math.floor(e.x),by=Math.floor(e.y),bz=Math.floor(e.z);for(let a=-2;a<=2;a++)for(let b=-1;b<=1;b++)for(let c=-2;c<=2;c++){const id=getB(bx+a,by+b,bz+c);if(id&&id!==BK.obsidian&&id!==BK.end_stone&&id!==BK.bedrock&&id!==BK.iron_bars&&id!==BK.fire&&BL[id].hard>=0&&!BL[id].portal)setB(bx+a,by+b,bz+c,0);}}}

function tryLightPortal(x,y,z){// поиск рамки обсидиана (4×5..23×23)
  for(const ax of [0,1]){const dx=ax?0:1,dz=ax?1:0;let bx=x,bz=z,by=y;let k=0;while(getB(bx-dx,by,bz-dz)===0&&k<22){bx-=dx;bz-=dz;k++;}while(getB(bx,by-1,bz)===0&&by>1&&k<44){by--;k++;}
    if(getB(bx-dx,by,bz-dz)!==BK.obsidian||getB(bx,by-1,bz)!==BK.obsidian)continue;let w=0;while(getB(bx+dx*w,by,bz+dz*w)===0&&w<22)w++;let h=0;while(getB(bx,by+h,bz)===0&&h<22)h++;
    if(w<2||h<3)continue;let ok=true;for(let i=0;i<w&&ok;i++){if(getB(bx+dx*i,by-1,bz+dz*i)!==BK.obsidian||getB(bx+dx*i,by+h,bz+dz*i)!==BK.obsidian)ok=false;for(let j=0;j<h&&ok;j++)if(getB(bx+dx*i,by+j,bz+dz*i)!==0&&getB(bx+dx*i,by+j,bz+dz*i)!==BK.fire)ok=false;}
    for(let j=0;j<h&&ok;j++){if(getB(bx-dx,by+j,bz-dz)!==BK.obsidian||getB(bx+dx*w,by+j,bz+dz*w)!==BK.obsidian)ok=false;}if(!ok)continue;
    for(let i=0;i<w;i++)for(let j=0;j<h;j++)setB(bx+dx*i,by+j,bz+dz*i,BK.nether_portal,ax,NOUPD);sfx('portal_lit',x,y,z);return true;}return false;}

function brRiftNear(x,z){const RG=48,rx=Math.floor(x/RG),rz=Math.floor(z/RG);let best=null,bd=1e9;for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++)if(GEN.brRift(rx+a,rz+b)){const cx=(rx+a)*RG+24.5,cz=(rz+b)*RG+24.5,d=Math.hypot(cx-x,cz-z);if(d<bd){bd=d;best=[cx,BR_F,cz,d];}}return best;}

function findOrMakePortal(tx,tz,dim){NET.act++;try{return findOrMakePortal0(tx,tz,dim);}finally{NET.act--;}}
function findOrMakePortal0(tx,tz,dim){const K=BK;let best=null,bd=1e9;
  for(let x=tx-24;x<=tx+24;x++)for(let z=tz-24;z<=tz+24;z++){if(!loadedAt(x,z))continue;for(let y=1;y<CH-1;y++)if(getB(x,y,z)===K.nether_portal&&getB(x,y-1,z)!==K.nether_portal){const d=(x-tx)**2+(z-tz)**2;if(d<bd){bd=d;best=[x+.5,y,z+.5];}}}
  if(best){const ax=getM(Math.floor(best[0]),best[1],Math.floor(best[2]))&1;return [best[0]+(ax?.0:.0),best[1],best[2]];}
  // построить портал
  let py=-1;const ylist=dim===1?[...Array(80).keys()].map(i=>30+i):[...Array(90).keys()].map(i=>SEA+i-10);
  outer:for(const r of [0,4,8,12,16])for(let a=0;a<8;a++){const x=tx+Math.round(Math.cos(a*TAU/8)*r),z=tz+Math.round(Math.sin(a*TAU/8)*r);for(const y of ylist){if(SOLIDB[getB(x,y-1,z)]&&SOLIDB[getB(x+1,y-1,z)]&&passable(x,y,z,4)&&passable(x+1,y,z,4)&&passable(x,y,z+1,3)&&!BL[getB(x,y-1,z)].liquid){tx=x;tz=z;py=y;break outer;}}}
  if(py<0){py=dim===1?Math.max(34,Math.min(100,64)):Math.max(SEA+2,topY(tx,tz)+1);for(let a=-1;a<=2;a++)for(let b=-1;b<=1;b++){setB(tx+a,py-1,tz+b,K.obsidian);for(let c=0;c<4;c++)setB(tx+a,py+c,tz+b,0);}}
  for(let a=-1;a<=2;a++)for(let c=-1;c<=3;c++){const edge=a===-1||a===2||c===-1||c===3;setB(tx+a,py+c,tz,edge?K.obsidian:K.nether_portal,0,NOUPD);}
  return [tx+.5,py,tz+.5];}

  const ok=[];const seen=new Set();for(const r of RECIPES){if(seen.has(r.out))continue;if(r.shaped&&(r.w>W||r.h>W))continue;const need=new Map();const ings=r.shaped?r.shaped.flat().filter(Boolean):r.less;if(!r.shaped&&ings.length>W*W)continue;let can=true;
    for(const opts of ings){const id=opts.find(o=>(have.get(o)||0)-(need.get(o)||0)>0);if(id===undefined){can=false;break;}need.set(id,(need.get(id)||0)+1);}if(can){ok.push(r);seen.add(r.out);}if(ok.length>=40)break;}
  el.innerHTML=`<div class="sec">Книга рецептов</div><div class="rbgrid">${ok.map((r,i)=>`<div class="slot rbs" data-r="${RECIPES.indexOf(r)}" title="${esc(IT[r.out].n)}">${icEl(r.out)}${r.n>1?'<b>'+r.n+'</b>':''}</div>`).join('')||'<div class="g">Нет доступных рецептов</div>'}</div>`;
  for(const s of el.querySelectorAll('.rbs'))s.onmousedown=ev=>{ev.stopPropagation();fillRecipe(RECIPES[+s.dataset.r],W);};}
function fillRecipe(r,W){const g=W===2?UI.craft2:UI.craft;for(let i=0;i<g.length;i++)if(g[i]){giveItem(g[i]);g[i]=null;}
  const pull=opts=>{for(let i=0;i<36;i++){const s=PLAYER.inv[i];if(s&&opts.includes(s.id)){s.n--;const one={id:s.id,n:1};if(!s.n)PLAYER.inv[i]=null;return one;}}return null;};
  if(r.shaped){for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++){const o=r.shaped[y][x];if(o)g[y*W+x]=pull(o);}}else r.less.forEach((o,i)=>{g[i]=pull(o);});renderUI();}

      if(top&&!wd&&v<grassH[gx]+1){const g=tex('grass_top',gx>>1,gy>>1);col=[g[0]*124/255,g[1]*189/255,g[2]*80/255];}

Ты разжёг огонь в рамке из застывшей лавы и шагнул туда, где небо горит.
Ты вернулся. Ты всегда возвращаешься.
Потом ты смотрел в глаз, который летел к земле, и шёл за ним, как когда-то шёл за солнцем.
Ты нашёл дверь, о которой никто не говорил вслух, и открыл её.
Там, на краю всего, тебя ждал дракон. Он был последним вопросом этого мира.
И ты ответил.
Но послушай. Мир не заканчивается здесь. Он никогда не заканчивался.
Каждый блок, который ты поставил, — это слово. Каждая шахта — предложение. Каждый мост — абзац.
Ты пишешь этот мир, даже когда думаешь, что просто играешь.
Бесконечность — это не расстояние. Это то, что остаётся, когда ты решаешь построить ещё что-то.
Мы — это шум, из которого растут горы. Мы — это сид, который ты ввёл однажды, не зная, что он значит.
А значил он вот что: ты здесь, и этого достаточно.
Проснись. Утро уже начинается. Трава всё ещё зелёная, а небо всё ещё ждёт.
Иди и построй что-нибудь, чего ещё не было.`;

  for(const k of ['tamed','owner','wool','sheared','prof','trades','persist','charged','lifeT'])if(o[k]!==undefined)e[k]=o[k];if(o.sit)e.st.sit=true;if(o.stinv)e.st.inv=o.stinv;if(e.t==='wither')bossBar(e);}}

/* ============================================================

   Игроки соединяются напрямую (WebRTC, P2P). Для поиска друг друга по нику используется

   у него мобы, предметы, механизмы и сохранение; гость строит ландшафт сам по сиду и получает
   от хозяина только изменённые чанки и события.
   ============================================================ */
const NET_VER=1;
const NET={dbgS:{},dbgR:{},st:'off',err:'',ws:null,bc:null,id:null,hb:null,retry:0,retryT:null,
  hosting:false,guest:false,host:null,peers:new Map(),guests:new Map(),others:new Map(),gh:new Map(),pres:{},pend:new Map(),

/* ---------- ник, скин, идентификатор ---------- */
function nickOk(n){return typeof n==='string'&&/^[A-Za-zА-Яа-яЁё0-9_\-]{3,16}$/.test(n);}
function nkey(n){return String(n||'').toLowerCase();}
function nickId(n){const u=new TextEncoder().encode(nkey(n));let h='';for(const b of u)h+=b.toString(16).padStart(2,'0');return 'bcraft67-'+h;}
function idNick(id){try{const h=String(id).replace(/^bcraft67-/,'');const u=new Uint8Array(h.length/2);for(let i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return new TextDecoder().decode(u);}catch(e){return '';}}
function myNick(){return SET.nick||'Игрок';}
function netInit(){if(!SET.friends)SET.friends={};if(SET.skin===undefined)SET.skin=0;if(!SET.uid){SET.uid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);saveSet();}}/* uid не меняется при смене ника — по нему друзья узнают вас под новым ником */

/* ---------- скин: 2D-превью (кукла в инвентаре, выбор скина) ---------- */
function skin2D(x,i,X,Y,u){if(i===-1&&SKIN_IMG){skin2DImg(x,SKIN_IMG,!!SET.skinSlim,X,Y,u);return;}const S=SKIN_DEFS[i]||SKIN_DEFS[0];const r=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;const px=(cx,cy,w,h,c)=>{x.fillStyle=r(c);x.fillRect(X+cx*u,Y+cy*u,w*u,h*u);};

    px(5,4,1,1,[245,245,245]);px(6,4,1,1,S.eye);px(9,4,1,1,S.eye);px(10,4,1,1,[245,245,245]);px(7,5,2,1,dk(S.skin,.82));px(6,6,4,1,dk(S.skin,.62));if(S.beard)px(5,7,6,1,S.hr2);}
  px(4,8,8,12,S.body);px(6,8,4,1,dk(S.body,.7));if(S.stripe)px(4,13,8,1,S.stripe);if(S.coat)px(7,8,2,12,S.coat);if(S.belt)px(4,19,8,1,S.belt);/* туловище */

function skin2DImg(x,d,slim,X,Y,u){const aw=slim?3:4;const bl=(sx,sy,w,h,dx,dy,ov)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++){const s=((sy+j)*64+sx+i)*4;if(ov&&d[s+3]<26)continue;x.fillStyle=`rgb(${d[s]},${d[s+1]},${d[s+2]})`;x.fillRect(X+(dx+i)*u,Y+(dy+j)*u,u,u);}};
  bl(8,8,8,8,4,0);bl(20,20,8,12,4,8);bl(44,20,aw,12,4-aw,8);bl(36,52,aw,12,12,8);bl(4,20,4,12,4,20);bl(20,52,4,12,8,20);
  bl(40,8,8,8,4,0,1);bl(20,36,8,12,4,8,1);bl(44,36,aw,12,4-aw,8,1);bl(52,52,aw,12,12,8,1);bl(4,36,4,12,4,20,1);bl(4,52,4,12,8,20,1);}
/* ---------- сигнальный сервер (PeerJS) или локальный канал (вкладки одного браузера) ---------- */
function netUrl(){return (SET.netSrv||'').trim()||'wss://0.peerjs.com:443/peerjs';}
function netConnect(){netInit();if(!nickOk(SET.nick))return;NET.boxQ=new Map();if(NET.ws||NET.bc||NET.mq)netDisconnect(true);NET.st='connecting';NET.err='';NET.id=nickId(SET.nick);netUI();
  if((SET.netSrv||'').trim()==='local'){/* локальный режим: несколько вкладок одного браузера (для проверки) */
    const bc=new BroadcastChannel('bcraft-net');NET.bc=bc;let taken=false;
    bc.onmessage=ev=>{const m=ev.data;if(!m)return;if(m.type==='HELLO'&&m.src===NET.id&&m.n!==NET.nonce){bc.postMessage({type:'TAKEN',dst:NET.id,n:m.n});return;}
      if(m.type==='TAKEN'&&m.dst===NET.id&&m.n===NET.nonce){taken=true;return;}if(m.dst!==NET.id)return;netSig(m);};
    NET.nonce=Math.random().toString(36).slice(2);bc.postMessage({type:'HELLO',src:NET.id,n:NET.nonce});
    setTimeout(()=>{if(NET.bc!==bc)return;if(taken){netSigErr('Этот ник уже используется (игра открыта в другой вкладке?)');return;}netOnline();},350);return;}
  const srv=(SET.netSrv||'').trim();if(!/peerjs/i.test(srv)){mqttConnect(srv);return;}/* по умолчанию — публичные MQTT-брокеры */
  if(!SET.netTok){SET.netTok=Math.random().toString(36).slice(2);saveSet();}
  let ws;try{ws=new WebSocket(netUrl()+'?key='+encodeURIComponent(SET.netKey||'peerjs')+'&id='+NET.id+'&token='+SET.netTok+'&version=1.5.4');}catch(e){netSigErr('Не удалось подключиться к серверу');return;}
  NET.ws=ws;const to=setTimeout(()=>{if(NET.ws===ws&&NET.st==='connecting'){try{ws.close();}catch(e){}}},20000);
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.type==='OPEN'){clearTimeout(to);netOnline();return;}
    if(m.type==='ID-TAKEN'){clearTimeout(to);NET.noRetry=true;netSigErr('Этот ник сейчас уже в сети. Выберите другой или закройте игру на другом устройстве.');try{ws.close();}catch(e){}return;}
    if(m.type==='ERROR'){NET.err=(m.payload&&m.payload.msg)||'ошибка сервера';netUI();return;}
    if(m.type==='EXPIRE'){const n=idNick(m.src);netNoReply(nkey(n));return;}
    if(m.type==='LEAVE'){const n=nkey(idNick(m.src));const pr=NET.pres[n];if(pr)pr.on=false;netUI();return;}
    if(m.type==='HEARTBEAT')return;netSig(m);};
  ws.onclose=()=>{clearTimeout(to);if(NET.ws!==ws)return;NET.ws=null;clearInterval(NET.hb);const was=NET.st;NET.st=NET.st==='error'?'error':'off';netUI();
    if(!NET.noRetry&&nickOk(SET.nick)){NET.retry=Math.min(6,NET.retry+1);clearTimeout(NET.retryT);NET.retryT=setTimeout(netConnect,[2,4,8,15,30,60,60][NET.retry]*1000);}
    if(was==='online'&&(NET.hosting||NET.guest))chatMsg('Связь с сервером поиска потеряна — уже подключённые игроки продолжают играть','#fa6');};
  ws.onerror=()=>{if(NET.st==='connecting'){NET.err='Сервер поиска недоступен';}};}
function netOnline(){NET.st='online';NET.err='';NET.retry=0;NET.noRetry=false;clearInterval(NET.hb);if(NET.ws)NET.hb=setInterval(()=>{try{NET.ws&&NET.ws.readyState===1&&NET.ws.send(JSON.stringify({type:'HEARTBEAT'}));}catch(e){}},5000);
  netUI();netPresAll();if(NET.hosting)netAnnounce(true);/* отправленные заявки повторяем, когда снова в сети */for(const k in SET.friends){const f=SET.friends[k];if(f.s==='out')netAppBox(f.n,{k:'freq'});}
  /* сообщаем друзьям о смене ника (неделю, пока все не увидят) */SET.pendRen=(SET.pendRen||[]).filter(x=>Date.now()-x.t<7*864e5&&nkey(x.o)!==nkey(SET.nick));for(const x of SET.pendRen)for(const k in SET.friends)netAppBox(SET.friends[k].n,{k:'ren',old:x.o});}
function netSigErr(t){NET.st='error';NET.err=t;netUI();}
function netDisconnect(keepState){clearInterval(NET.hb);clearTimeout(NET.retryT);clearTimeout(NET.mqT);if(NET.mq){for(const c of NET.mq.conns)c.close();NET.mq=null;}if(NET.ws){const w=NET.ws;NET.ws=null;try{w.close();}catch(e){}}if(NET.bc){try{NET.bc.close();}catch(e){}NET.bc=null;}if(!keepState){NET.st='off';netUI();}}
/* ---------- MQTT поверх WebSocket: публичные брокеры как «почтовые ящики» для поиска друзей ----------
   Подключаемся сразу к двум брокерам и шлём через оба: если один тормозит или недоступен, всё равно дойдёт. */
/* несколько независимых серверов поиска: если какой-то недоступен в стране/сети друга, общий всё равно найдётся */
const MQTT_DEF=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt','wss://mqtt.eclipseprojects.io:443/mqtt'];
const mqStr=s=>{const b=new TextEncoder().encode(s);const o=new Uint8Array(b.length+2);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o;};
function mqPkt(h,parts){let n=0;for(const p of parts)n+=p.length;const L=[];let x=n;do{let d=x%128;x=Math.floor(x/128);if(x>0)d|=128;L.push(d);}while(x>0);
  const o=new Uint8Array(1+L.length+n);o[0]=h;o.set(L,1);let k=1+L.length;for(const p of parts){o.set(p,k);k+=p.length;}return o;}
function mqTopic(id){return 'bcraft67/u/'+id;}
function mqBox(dst,src,kind){return 'bcraft67/m/'+dst+'/'+src+'_'+(kind||'f');}/* «почтовый ящик»: заявки в друзья хранятся на сервере, пока друг не зайдёт в сеть */
class MqttConn{constructor(url){this.url=url;this.ok=false;this.dead=false;this.buf=new Uint8Array(0);this.retry=0;this.open();}
  open(){let ws;try{ws=new WebSocket(this.url,'mqtt');}catch(e){this.later();return;}ws.binaryType='arraybuffer';this.ws=ws;
    ws.onopen=()=>{const cid='bc'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-6);
      this.send(mqPkt(0x10,[new Uint8Array([0,4,77,81,84,84,4,2,0,60]),mqStr(cid)]));};
    ws.onmessage=e=>{if(typeof e.data==='string')return;this.data(new Uint8Array(e.data));};
    ws.onclose=()=>{this.ok=false;clearInterval(this.pi);if(this.ws!==ws)return;this.ws=null;this.buf=new Uint8Array(0);mqttState();if(!this.dead)this.later();};
    ws.onerror=()=>{};}
  later(){this.retry=Math.min(6,this.retry+1);clearTimeout(this.rt);this.rt=setTimeout(()=>{if(!this.dead)this.open();},[1,2,4,8,15,30,30][this.retry]*1000);}
  send(u){if(this.ws&&this.ws.readyState===1){try{this.ws.send(u);}catch(e){}}}
  data(u){const b=new Uint8Array(this.buf.length+u.length);b.set(this.buf);b.set(u,this.buf.length);this.buf=b;
    for(;;){const B=this.buf;if(B.length<2)break;let rl=0,m=1,i=1,ok=false;for(;i<5&&i<B.length;i++){rl+=(B[i]&127)*m;m*=128;if(!(B[i]&128)){ok=true;break;}}if(!ok)break;
      const hd=i+1,tot=hd+rl;if(B.length<tot)break;const t=B[0]>>4,fl=B[0]&15,p=B.subarray(hd,tot);this.buf=B.slice(tot);try{this.pkt(t,fl,p);}catch(e){console.warn('mqtt',e);}}}
  pkt(t,fl,p){if(t===2){if(p[1]!==0){this.dead=true;try{this.ws.close();}catch(e){}return;}/* CONNACK → подписка на свой ящик */
      this.send(mqPkt(0x82,[new Uint8Array([0,1]),mqStr(mqTopic(NET.id)),new Uint8Array([0]),mqStr('bcraft67/m/'+NET.id+'/+'),new Uint8Array([0])]));return;}
    if(t===9){this.ok=true;this.retry=0;clearInterval(this.pi);this.pi=setInterval(()=>this.send(new Uint8Array([0xC0,0])),30000);
      this.pub(mqTopic(NET.id),JSON.stringify({type:'HELLO',src:NET.id,n:NET.nonce,mid:Math.random().toString(36).slice(2)}));mqttState();
      /* письма в ящики друзей — на каждый подключившийся сервер */if(NET.boxQ)for(const [t,s] of NET.boxQ)this.pub(t,s,true);return;}
    if(t===3){const tl=(p[0]<<8)|p[1];let off=2+tl;if((fl>>1)&3)off+=2;const D=new TextDecoder();if(off>=p.length)return;mqttIn(D.decode(p.subarray(off)),D.decode(p.subarray(2,2+tl)));}}
  pub(topic,str,ret){this.send(mqPkt(ret?0x31:0x30,[mqStr(topic),new TextEncoder().encode(str)]));}
  close(){this.dead=true;this.ok=false;clearTimeout(this.rt);clearInterval(this.pi);if(this.ws){const w=this.ws;this.ws=null;try{w.send(new Uint8Array([0xE0,0]));}catch(e){}try{w.close();}catch(e){}}}}
function mqttConnect(srv){const urls=srv?srv.split(/\s*,\s*/).filter(Boolean):MQTT_DEF;NET.nonce=Math.random().toString(36).slice(2);NET.mq={conns:[],seen:new Set(),q:[]};
  for(const u of urls)NET.mq.conns.push(new MqttConn(u));
  clearTimeout(NET.mqT);NET.mqT=setTimeout(()=>{if(NET.mq&&NET.st==='connecting')netSigErr('Серверы поиска не отвечают — проверьте интернет (игра будет пробовать снова)');},20000);}
function mqttState(){if(!NET.mq)return;const n=NET.mq.conns.filter(c=>c.ok).length;NET.mqN=n;
  if(n>0&&NET.st!=='online'){clearTimeout(NET.mqT);netOnline();}else if(n===0&&NET.st==='online'){NET.st='connecting';NET.err='';}netUI();}
function mqttPub(dst,m){if(!NET.mq)return false;m.mid=Math.random().toString(36).slice(2)+Date.now().toString(36);const str=JSON.stringify(m);let ok=false;
  for(const c of NET.mq.conns)if(c.ok){c.pub(mqTopic(dst),str);ok=true;}return ok;}
function mqttIn(str,topic){let m;try{m=JSON.parse(str);}catch(e){return;}const M=NET.mq;if(!M||!m)return;
  /* письмо из ящика получено — удаляем его с серверов */if(topic&&topic.startsWith('bcraft67/m/'))for(const c of M.conns)if(c.ok)c.pub(topic,'',true);if(m.mid){if(M.seen.has(m.mid))return;M.seen.add(m.mid);M.q.push(m.mid);if(M.q.length>600)M.seen.delete(M.q.shift());}
  if(m.src===NET.id){/* сообщения в собственный ящик: проверка, не занят ли ник */
    if(m.type==='HELLO'&&m.n!==NET.nonce){for(const c of M.conns)if(c.ok)c.pub(mqTopic(NET.id),JSON.stringify({type:'TAKEN',src:NET.id,n:m.n,mid:Math.random().toString(36).slice(2)}));}
    else if(m.type==='TAKEN'&&m.n===NET.nonce){NET.noRetry=true;netDisconnect(true);netSigErr('Этот ник сейчас уже в сети (игра открыта на другом устройстве или вкладке). Выберите другой ник.');}
    return;}
  netSig(m);}
function sigSend(nick,type,payload){const dst=nickId(nick);payload.from=myNick();
  if(NET.bc){NET.bc.postMessage(JSON.parse(JSON.stringify({type,payload,src:NET.id,dst})));return true;}
  if(NET.mq)return mqttPub(dst,{type,payload,src:NET.id});
  if(NET.ws&&NET.ws.readyState===1){NET.ws.send(JSON.stringify({type,payload,dst}));return true;}return false;}
function netApp(nick,o){return sigSend(nick,'CANDIDATE',Object.assign({bc:'app',uid:SET.uid},o));}
/* заявки/ответы в друзья: и сразу, и в «ящик» на сервере — дойдут, даже если друг сейчас не в сети */
function netAppBox(nick,o){const ok=netApp(nick,o);if(NET.mq){const dst=nickId(nick),m={type:'CANDIDATE',payload:Object.assign({bc:'app',from:myNick(),uid:SET.uid},o),src:NET.id,mid:Math.random().toString(36).slice(2)+Date.now().toString(36)};
    const str=JSON.stringify(m),t=mqBox(dst,NET.id,o.k==='ren'?'r':'f');(NET.boxQ||(NET.boxQ=new Map())).set(t,str);for(const c of NET.mq.conns)if(c.ok)c.pub(t,str,true);}return ok;}
/* друг сменил ник: переносим его в списке под новым ником */
function friendRename(ko,k,from,uid){const F=SET.friends,fo=F[ko];if(!fo||ko===k)return;const cur=F[k];F[k]=Object.assign({},fo,{n:from,uid:uid||fo.uid});if(cur&&cur.s==='ok')F[k].s='ok';delete F[ko];
  if(NET.pres[ko]){NET.pres[k]=NET.pres[ko];delete NET.pres[ko];}saveSet();toast(fo.n+' теперь '+from);if(GAME.on)chatMsg('Друг '+fo.n+' сменил ник на '+from,'#9cf');netPres(from);netUI();}
/* входящие сообщения сигнального сервера */
function netSig(m){const P=m.payload||{};const from=P.from||idNick(m.src),k=nkey(from);if(!nickOk(from))return;
  if(P.bc==='app')return netAppMsg(from,k,P);
  if(P.bc==='rl')return relayIn(from,k,P);
  if(m.type==='OFFER'&&P.bc==='rtc')return hostOffer(from,k,P);
  if(m.type==='ANSWER'&&P.bc==='rtc'){const p=NET.peers.get(k);if(p)p.answer(P.sdp);return;}
  if(m.type==='CANDIDATE'&&P.bc==='ice'){const p=NET.peers.get(k);if(p)p.ice(P.c);return;}}
/* друзья и присутствие (через сигнальный сервер, без прямого соединения) */

/* ---------- прямое соединение WebRTC ---------- */
class NPeer{constructor(nick,init){this.nick=nick;this.k=nkey(nick);this.open=false;this.dead=false;this.iceQ=[];this.hasRD=false;this.chq=[];this.sent=0;
    const pc=new RTCPeerConnection({iceServers:netIce()});this.pc=pc;
    pc.onicecandidate=e=>{if(e.candidate)sigSend(nick,'CANDIDATE',{bc:'ice',c:e.candidate.toJSON?e.candidate.toJSON():e.candidate});};
    pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed')this.close(pc.connectionState==='failed'?'не удалось установить прямое соединение':'соединение закрыто');};
    if(init){this.setDC(pc.createDataChannel('bc',{ordered:true}));pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>sigSend(nick,'OFFER',{bc:'rtc',sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp},ver:NET_VER})).catch(e=>this.close('ошибка WebRTC: '+e.message));}
    else pc.ondatachannel=e=>this.setDC(e.channel);}
  setDC(dc){dc.binaryType='arraybuffer';this.dc=dc;dc.onopen=()=>{this.open=true;netPeerOpen(this);};dc.onmessage=e=>{try{netData(this,e.data);}catch(err){console.error('net',err);}};dc.onclose=()=>this.close('соединение закрыто');}
  async offer(sdp){try{await this.pc.setRemoteDescription(sdp);this.hasRD=true;this.flushIce();const a=await this.pc.createAnswer();await this.pc.setLocalDescription(a);sigSend(this.nick,'ANSWER',{bc:'rtc',sdp:{type:this.pc.localDescription.type,sdp:this.pc.localDescription.sdp}});}catch(e){this.close('ошибка WebRTC: '+e.message);}}
  async answer(sdp){try{await this.pc.setRemoteDescription(sdp);this.hasRD=true;this.flushIce();}catch(e){this.close('ошибка WebRTC: '+e.message);}}
  ice(c){if(!this.hasRD){this.iceQ.push(c);return;}this.pc.addIceCandidate(c).catch(()=>{});}
  flushIce(){for(const c of this.iceQ)this.pc.addIceCandidate(c).catch(()=>{});this.iceQ=[];}
  send(o){if(!this.open||this.dead)return;try{this.dc.send(JSON.stringify(o));this.sent++;NET.dbgS[o.k]=(NET.dbgS[o.k]||0)+1;}catch(e){NET.dbgE=(NET.dbgE||'')+e.message+';';}}
  sendBin(o,parts){if(!this.open||this.dead)return;const js=new TextEncoder().encode(JSON.stringify(o));let n=4+js.length;for(const p of parts)n+=p.byteLength;const u=new Uint8Array(n);new DataView(u.buffer).setUint32(0,js.length);u.set(js,4);let o2=4+js.length;
    for(const p of parts){u.set(new Uint8Array(p.buffer||p,p.byteOffset||0,p.byteLength),o2);o2+=p.byteLength;}try{this.dc.send(u.buffer);}catch(e){}}
  busy(){return this.dc&&this.dc.bufferedAmount>600000;}
  close(why){if(this.dead)return;this.dead=true;this.open=false;try{this.dc&&this.dc.close();}catch(e){}try{this.pc.close();}catch(e){}if(NET.peers.get(this.k)===this)NET.peers.delete(this.k);netPeerClose(this,why);}}
function netData(p,data){if(typeof data!=='string'){const u=new Uint8Array(data),L=new DataView(data).getUint32(0);const o=JSON.parse(new TextDecoder().decode(u.subarray(4,4+L)));o.bin=data.slice(4+L);netMsg(p,o);return;}netMsg(p,JSON.parse(data));}

function netGuestLeave(g,why,silent){if(!NET.guests.has(g.k))return;NET.guests.delete(g.k);if(g.ps){NET.gstates=NET.gstates||{};NET.gstates[g.k]=g.ps;}

class RPeer{constructor(nick,init,sid){this.nick=nick;this.k=nkey(nick);this.relay=true;this.open=false;this.dead=false;this.chq=[];this.sent=0;this.sid=sid||Math.random().toString(36).slice(2,10);

  switch(e.t){case 'item':updItem(e,dt);break;case 'xp':updXP(e,dt);break;case 'falling':updFalling(e,dt);break;case 'tnt':updTNT(e,dt);break;case 'cloud':updCloud(e,dt);break;case 'bobber':updBobber(e,dt);break;
    case 'bolt':e.life-=dt;if(e.life<=0)e.dead=true;break;case 'crystal':break;case 'ender_dragon':updDragon(e,dt);break;
    default:if(e instanceof Proj){if(e.t==='trident'&&e.returning){const p=PLAYER;const dx=p.x-e.x,dy=p.y+1-e.y,dz=p.z-e.z,l=Math.hypot(dx,dy,dz);e.stuck=false;e.x+=dx/l*20*dt;e.y+=dy/l*20*dt;e.z+=dz/l*20*dt;if(l<1.2){giveItem(e.st);e.dead=true;}}else updProj(e,dt);}}
  if(e.dead&&!(e.def&&e.t!=='ender_dragon')){if(e.t==='trident'&&!e.returning&&e.st&&!e.picked){}ENTS.splice(i,1);}}
  // кристаллы ловят стрелы (простая проверка)
}

/* Ctrl+колёсико, Ctrl +/−/0 и щипок не масштабируют интерфейс игры */

for(const ev of ['gesturestart','gesturechange','gestureend'])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
addEventListener('pointerdown',()=>SND.resume(),true);addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['Equal','Minus','Digit0','NumpadAdd','NumpadSubtract','Numpad0','BracketRight','Slash'].includes(e.code)&&!(CHAT.open&&e.code==='Slash'))e.preventDefault();SND.resume();if(e.code==='F11'){e.preventDefault();toggleFullscreen();return;}const c=e.code;
  if(CHAT.open){if(c==='Enter'||c==='NumpadEnter'){chatSubmit();e.preventDefault();}else if(c==='Escape'){closeChat();e.preventDefault();}return;}
  if(document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='SELECT')&&c!=='Escape')return;
  if(/^F\d+$/.test(c)||c==='Space'||c==='Tab')e.preventDefault();
  if(!GAME.on){return;}
  /* в игре браузерные сочетания с Ctrl (сохранить, закладка, поиск, печать…) не срабатывают */
  if((e.ctrlKey||e.metaKey)&&!UI.open&&!GAME.paused&&c!=='KeyV'&&c!=='KeyC')e.preventDefault();
  if((c==='ControlLeft'||c==='ControlRight')&&(SET.keys.sprint===c)&&!document.fullscreenElement&&!TOUCH.on&&!GAME.ctrlHint){GAME.ctrlHint=true;toast('Совет: Ctrl+W в браузере закрывает вкладку. Включите полный экран (F11) — там Ctrl работает как бег без проблем. Бежать можно и двойным нажатием W.');}
  if(GAME.credits)return;
  if(c==='Escape'){e.preventDefault();if(UI.open){closeUI();return;}if(GAME.deadScreen)return;if(GAME.paused&&!GAME.credits){if(performance.now()-(GAME.pauseAt||0)<400)return;resumeGame();return;}pauseScreen();return;}
  if(GAME.paused||GAME.deadScreen)return;
  if(UI.open){if(c===SET.keys.inventory){closeUI();}else if(/^Digit[1-9]$/.test(c)){const el=document.querySelector('#ui .slot:hover');if(el&&el.dataset.a&&el.dataset.a!=='cr'&&el.dataset.a!=='out'){const arr=getArr(el.dataset.a);const i=+el.dataset.i,h=+c.slice(5)-1;if(arr){const t=arr[i];arr[i]=PLAYER.inv[h];PLAYER.inv[h]=t;renderUI();}}}else if(c===SET.keys.drop){const el=document.querySelector('#ui .slot:hover');if(el&&el.dataset.a){const arr=getArr(el.dataset.a);const s=arr&&arr[+el.dataset.i];if(s){const n=e.ctrlKey?s.n:1;dropItem(PLAYER.x,PLAYER.y+1.3,PLAYER.z,Object.assign({},s,{n}),lookVec().map(v=>v*4));s.n-=n;if(!s.n)arr[+el.dataset.i]=null;renderUI();}}}return;}
  KEYS.add(c);
  if(c===SET.keys.forward){if(GAME.time-lastW<.28)PLAYER.sprint=true;lastW=GAME.time;}
  if(/^Digit[1-9]$/.test(c)){PLAYER.sel=+c.slice(5)-1;PLAYER.equipT=.25;UI.dirty=true;}
  else if(c===SET.keys.inventory){if(PLAYER.mode!=='spectator')openUI('inv');}
  else if(c===SET.keys.drop){const s=selStack();if(s&&PLAYER.mode!=='spectator'){const n=e.ctrlKey?s.n:1;dropItem(PLAYER.x,PLAYER.y+1.3,PLAYER.z,Object.assign({},s,{n}),lookVec().map(v=>v*5));s.n-=n;if(!s.n)PLAYER.inv[PLAYER.sel]=null;UI.dirty=true;}}
  else if(c===SET.keys.swap){const t=PLAYER.off;PLAYER.off=selStack();PLAYER.inv[PLAYER.sel]=t;UI.dirty=true;}
  else if(c===SET.keys.chat){e.preventDefault();openChat('');}else if(c===SET.keys.command){e.preventDefault();openChat('/');}
  else if(c===SET.keys.debug){GAME.debug=!GAME.debug;}else if(c===SET.keys.perspective){GAME.view=(GAME.view+1)%3;}
  else if(c===SET.keys.hidehud){GAME.hideHud=!GAME.hideHud;$('hud').classList.toggle('hidden',GAME.hideHud);}
  else if(c===SET.keys.screenshot){screenshot();}});
addEventListener('keyup',e=>KEYS.delete(e.code));
addEventListener('blur',()=>{KEYS.clear();MOUSE.l=MOUSE.r=false;});

/* ---------- главный цикл ---------- */
let last=performance.now(),acc=0,fpsN=0,fpsT=0;
function loop(now){requestAnimationFrame(loop);let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;fpsN++;fpsT+=dt;if(fpsT>=.5){GAME.fps=Math.round(fpsN/fpsT);fpsN=0;fpsT=0;}
  try{
  if(PANO_BUILD){chunkManager(30);}
  else if(MENU_PANO){}
  else if(GAME.on){const active=(!GAME.paused||NET.hosting||NET.guest)&&!GAME.changing&&!GAME.credits;/* в сетевой игре пауза не останавливает мир */chunkManager(GAME.changing?40:IS_TOUCH?5:7);
    if(active){acc+=dt;let n=0;while(acc>=.05&&n<5){acc-=.05;gameTick();n++;}if(n>=5)acc=0;
      const steps=Math.max(1,Math.ceil(dt/.017)),sdt=dt/steps;for(let s=0;s<steps;s++){updatePlayer(sdt);updEntities(sdt);}updParticles(dt);
      if(Math.random()<dt*3){const x=Math.floor(PLAYER.x+(Math.random()-.5)*16),y=Math.floor(PLAYER.y+(Math.random()-.2)*8),z=Math.floor(PLAYER.z+(Math.random()-.5)*16);const id=getB(x,y,z);
        if(id&&SOLIDB[id]&&getB(x,y-1,z)===0){const a=getB(x,y+1,z);if(BL[a].liquid)spawnParticles('drip',x+Math.random(),y-.02,z+Math.random(),1,null,BL[a].liquid==='lava'?[250,120,20,255]:[60,90,230,220]);}
        if(id===BK.torch||id===BK.campfire||id===BK.lantern){let ox=.5,oy=.7,oz=.5;if(id===BK.torch){const m=getM(x,y,z);if(m){const v=attachedDir(id,m);ox-=v[0]*.28;oz-=v[2]*.28;oy=.9;}}spawnParticles('smoke',x+ox,y+oy+.05,z+oz,1);spawnParticles('flame',x+ox,y+oy,z+oz,1);}if(id===BK.nether_portal)spawnParticles('portal',x+Math.random(),y+Math.random(),z+Math.random(),2);if(CUR.id===1&&Math.random()<.2)spawnParticles('flame',x,y,z,0);}}}
  try{netTick(dt);}catch(e){console.error('net',e);}
  if(MENU_PANO&&!PANO_BUILD)drawPanorama(now);else if(GAME.on)renderFrame(now,dt);updHUD();updTouch();updBoss();SND.update(dt);
  }catch(err){console.error(err);window.__lastErr=err.stack;if(!loop.err){loop.err=1;toast('Ошибка: '+err.message);}}}

/* цифра «67» из алмазных блоков на равнине главного меню */
function build67(eye){const F={'6':['.###.','#....','#....','####.','#...#','#...#','.###.'],'7':['#####','....#','...#.','..#..','.#...','.#...','.#...']};
  const D=BK.diamond_block,K2=3,dist=46,ex=Math.floor(eye[0]),ez=Math.floor(eye[2]);const z0=ez-dist;const W=(5*2+2)*K2-K2;const x0=ex-Math.floor(W/2);
  let gy=0;for(let y=CH-2;y>0;y--){const b=getB(ex,y,z0);if(b&&SOLIDB[b]&&!BL[b].leaf&&!BL[b].log){gy=y;break;}}
  // расчищаем площадку и коридор обзора
  for(let x=x0-3;x<=x0+W+3;x++)for(let z=z0-3;z<=ez-2;z++)for(let y=gy+1;y<gy+30;y++){const b=getB(x,y,z);if(b&&(BL[b].leaf||BL[b].log||!SOLIDB[b]))setB(x,y,z,0,0,NOUPD);}
  ['6','7'].forEach((ch,di)=>{const G=F[ch];for(let r=0;r<7;r++)for(let c=0;c<5;c++){if(G[r][c]!=='#')continue;
    for(let a=0;a<K2;a++)for(let b=0;b<K2;b++)for(let t=0;t<2;t++){const x=x0+di*12*K2/2+c*K2+a,y=gy+1+(6-r)*K2+b,z=z0-t;setB(x,y,z,D,0,NOUPD);}}});
}
